<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ghi trạng thái máy</title>
<style>
  body { font-family: Arial, sans-serif; margin: 0; padding: 12px; background: #f2f2f2; font-size: 18px; }
  h1 { font-size: 28px; margin: 4px 0 12px; }
  .card { background: #fff; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
  label { display: block; font-weight: bold; margin: 8px 0 4px; }
  select, input { width: 100%; font-size: 20px; padding: 10px; box-sizing: border-box; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button { font-size: 22px; padding: 22px 8px; border: 0; border-radius: 12px; color: #fff; font-weight: bold; width: 100%; }
  .sx { background: #1e8e3e; } .tk { background: #e37400; }
  .dt { background: #1a73e8; } .dg { background: #d93025; }
  .phu { background: #666; font-size: 18px; padding: 14px; }
  .canh { background: #fff3cd; border: 2px solid #e0a800; padding: 12px; border-radius: 10px; margin-bottom: 12px; display: none; }
  .goiY { font-size: 14px; color: #666; margin-top: 4px; }
  #thongbao { position: fixed; left: 8px; right: 8px; bottom: 8px; background: #222; color: #fff; padding: 14px; border-radius: 8px; display: none; font-size: 18px; }
</style>
</head>
<body>
<h1>Máy <span id="may"></span></h1>

<div id="canh" class="canh">Đã sang ca mới. Chọn ca và bấm <b>Bắt đầu SX</b> để ghi ca mới.</div>

<div class="card">
  Trạng thái hiện tại: <b id="hientai">đang tải...</b>
</div>

<div class="card">
  <label>Nhân viên</label>
  <select id="nv"></select>

  <label>Ca</label>
  <select id="ca"></select>

  <label>Khuôn</label>
  <input id="timKhuon" placeholder="Gõ để tìm khuôn..." oninput="veKhuon(this.value)">
  <select id="khuon" style="margin-top:6px"></select>
  <div class="goiY" id="goiYKhuon"></div>

  <label>Lý do dừng (chỉ dùng khi bấm Dừng)</label>
  <select id="lydo"></select>
</div>

<div class="grid">
  <button class="sx" onclick="gui('SX')">Bắt đầu SX</button>
  <button class="tk" onclick="gui('THAY_KHUON')">Thay khuôn</button>
  <button class="dt" onclick="gui('DAP_THU')">Dập thử</button>
  <button class="dg" onclick="gui('DUNG')">Dừng</button>
</div>

<div class="card" style="margin-top:12px">
  <label>Phế phẩm (số lượng)</label>
  <input id="pp" type="number" min="1" inputmode="numeric">
  <button class="phu" style="margin-top:8px" onclick="guiPhePham()">Ghi phế phẩm</button>
</div>

<div class="card">
  <button class="phu" onclick="huyCuoi()">Hủy lần quét cuối</button>
</div>

<div id="thongbao"></div>

<script>
// ===== CẤU HÌNH: thay bằng URL triển khai Apps Script (kết thúc bằng /exec) =====
const APPS_URL = 'https://script.google.com/macros/s/AKfycbzBjiZDNNAReoHBJhrnf7kNmbxgA_eevHHGZ32jj5ruIaTfci4AhMOBuGUUoHEJaJ1Y/exec';

const qs  = new URLSearchParams(location.search);
const K   = qs.get('k') || '';
const MAY = qs.get('may') || '';
const TEN_TT = { SX:'Bắt đầu SX', THAY_KHUON:'Thay khuôn', DAP_THU:'Dập thử', DUNG:'Dừng', HUY:'Hủy' };
let lastRowKey = null;
let lastCa = null;
let DS_KHUON = [];

const $ = id => document.getElementById(id);
$('may').textContent = MAY;

function thongBao(t) {
  const e = $('thongbao'); e.textContent = t; e.style.display = 'block';
  setTimeout(() => e.style.display = 'none', 3000);
}

// ---------- Gọi Apps Script ----------
async function goiGet(params) {
  const u = new URL(APPS_URL);
  u.searchParams.set('k', K);
  Object.entries(params).forEach(([a, b]) => u.searchParams.set(a, b));
  const r = await fetch(u.toString());
  return r.json();
}

async function goiPost(action, p) {
  // text/plain để trình duyệt không gửi preflight, Apps Script đọc được
  const r = await fetch(APPS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ ...p, action, k: K })
  });
  return r.json();
}

// ---------- Danh mục ----------
function taoKey() {
  return MAY + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 6);
}

function fill(sel, rows, valKey, textFn) {
  sel.innerHTML = '';
  rows.forEach(r => {
    const o = document.createElement('option');
    o.value = r[valKey]; o.textContent = textFn(r);
    sel.appendChild(o);
  });
}

// Lọc danh sách khuôn theo ô tìm kiếm
function veKhuon(tuKhoa) {
  const t = (tuKhoa || '').trim().toLowerCase();
  const cu = $('khuon').value;
  const dsLoc = DS_KHUON.filter(r =>
    (String(r.MaKhuon) + ' ' + String(r.TenHang) + ' ' + String(r.MaHang)).toLowerCase().includes(t)
  );
  fill($('khuon'), dsLoc, 'MaKhuon', r => r.MaKhuon + ' (' + r.TenHang + ')');
  if (dsLoc.some(r => r.MaKhuon === cu)) $('khuon').value = cu;
  $('goiYKhuon').textContent = DS_KHUON.length
    ? 'Hiện ' + dsLoc.length + ' / ' + DS_KHUON.length + ' khuôn của máy này'
    : 'Máy này chưa có khuôn nào trong danh mục';
}

function hm(s) { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; }

function chonCaTheoGio(dsCa) {
  const d = new Date();
  const t = d.getHours() * 60 + d.getMinutes();
  for (const c of dsCa) {
    const a = hm(c.GioBD), b = hm(c.GioKT);
    const qua = c.QuaNgay === true || c.QuaNgay == 1;
    const trong = qua ? (t >= a || t < b) : (t >= a && t < b);
    if (trong) { $('ca').value = c.MaCa; return; }
  }
}

function khoiTao(dm) {
  fill($('nv'),   dm.nhanvien, 'MANV',   r => r.MANV + ' - ' + r.HOTEN);
  fill($('ca'),   dm.ca,       'MaCa',   r => r.TenCa);
  fill($('lydo'), dm.lydo,     'MaLyDo', r => r.TenLyDo);
  DS_KHUON = dm.khuon;
  veKhuon('');
  chonCaTheoGio(dm.ca);
}

async function taiDanhMuc() {
  if (!K || !MAY) { $('hientai').textContent = 'Liên kết không hợp lệ'; return; }
  try {
    const r = await goiGet({ action: 'danhmuc', may: MAY });
    if (!r.ok) throw new Error(r.loi);
    khoiTao(r.data);
    await taiHienTai();
    chayHangCho();
  } catch (e) {
    thongBao('Không tải được danh mục: ' + e.message);
  }
}

// ---------- Trạng thái hiện tại ----------
async function taiHienTai() {
  try {
    const r = await goiGet({ action: 'hientai', may: MAY });
    const d = r.ok ? r.data : null;
    lastRowKey = d ? d.rowKey : null;
    lastCa = d ? d.maCa : null;
    $('hientai').textContent = d
      ? (TEN_TT[d.trangThai] || d.trangThai) + ' · ' + d.thoiGian + (d.maKhuon ? ' · ' + d.maKhuon : '')
      : 'Chưa có trạng thái';
    $('canh').style.display = (lastCa && lastCa !== $('ca').value) ? 'block' : 'none';
  } catch (e) {
    $('hientai').textContent = 'Không tải được (kiểm tra mạng)';
  }
}

// ---------- Hàng chờ khi mất mạng ----------
function layHangCho() { return JSON.parse(localStorage.getItem('hangcho') || '[]'); }
function luuHangCho(q) { localStorage.setItem('hangcho', JSON.stringify(q)); }

function xepHang(action, p) {
  const q = layHangCho(); q.push({ action, p }); luuHangCho(q);
  chayHangCho();
}

async function chayHangCho() {
  const q = layHangCho();
  if (!q.length) return;
  try {
    const r = await goiPost(q[0].action, q[0].p);
    const cur = layHangCho(); cur.shift(); luuHangCho(cur);   // đã gửi (thành công hoặc bị từ chối)
    if (r.ok === false) thongBao('Không ghi được: ' + r.loi);
    else thongBao('Đã ghi');
    taiHienTai();
    chayHangCho();
  } catch (e) {
    // mất mạng: giữ nguyên hàng chờ, thử lại sau
    thongBao('Chưa gửi được, sẽ thử lại khi có mạng');
    setTimeout(chayHangCho, 15000);
  }
}

// ---------- Thao tác ----------
function gui(tt) {
  if (tt === 'DUNG' && !$('lydo').value) return thongBao('Chọn lý do dừng');
  if (tt !== 'DUNG' && !$('khuon').value) return thongBao('Chọn khuôn');
  if (!$('nv').value) return thongBao('Chọn nhân viên');
  xepHang('ghiTrangThai', {
    rowKey: taoKey(), thoiGianQuet: new Date().toISOString(),
    may: MAY, trangThai: tt, maCa: $('ca').value,
    maKhuon: tt === 'DUNG' ? '' : $('khuon').value,
    lyDo: tt === 'DUNG' ? $('lydo').value : '',
    maNV: $('nv').value, rowKeyHuy: ''
  });
}

function huyCuoi() {
  if (!lastRowKey) return thongBao('Không có lần quét nào để hủy');
  if (!$('nv').value) return thongBao('Chọn nhân viên');
  xepHang('ghiTrangThai', {
    rowKey: taoKey(), thoiGianQuet: new Date().toISOString(),
    may: MAY, trangThai: 'HUY', maCa: $('ca').value,
    maKhuon: '', lyDo: '', maNV: $('nv').value, rowKeyHuy: lastRowKey
  });
}

function guiPhePham() {
  const n = parseInt($('pp').value, 10);
  if (!(n > 0)) return thongBao('Nhập số lượng phế phẩm');
  if (!$('khuon').value) return thongBao('Chọn khuôn');
  if (!$('nv').value) return thongBao('Chọn nhân viên');
  xepHang('ghiPhePham', {
    rowKey: taoKey(), thoiGianQuet: new Date().toISOString(),
    may: MAY, maCa: $('ca').value, maKhuon: $('khuon').value,
    soLuong: n, maNV: $('nv').value
  });
  $('pp').value = '';
}

taiDanhMuc();
</script>
</body>
</html>
